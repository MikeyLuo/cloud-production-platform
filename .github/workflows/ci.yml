name: Portfolio CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    name: Build portfolio
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Check out repository
        uses: actions/checkout@v7
        with:
          persist-credentials: false

      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version: '24'
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Build website
        run: npm run build

      - name: Verify generated pages and resume
        shell: bash
        run: |
          for page in index about/index resume/index projects/index travel/index; do
            test -s "dist/${page}.html"
          done
          test -s dist/documents/Michael_Luong_Resume.pdf
          cmp public/documents/Michael_Luong_Resume.pdf dist/documents/Michael_Luong_Resume.pdf

      - name: Upload built website
        uses: actions/upload-artifact@v7
        with:
          name: portfolio-build
          path: dist/
          if-no-files-found: error
          retention-days: 7
      
      - name: Package website for GitHub Pages
        if: github.ref == 'refs/heads/main' && github.event_name != 'pull_request'
        uses: actions/upload-pages-artifact@v3
        with:
          path: dist/
  
  deploy:
    name: Deploy portfolio
    needs: build
    if: github.ref == 'refs/heads/main' && github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    timeout-minutes: 10

    permissions:
      pages: write
      id-token: write

    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}

    concurrency:
      group: portfolio-pages
      cancel-in-progress: false

    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
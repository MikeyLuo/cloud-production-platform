name: Portfolio CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    name: Build portfolio
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Check out repository
        uses: actions/checkout@v7
        with:
          persist-credentials: false

      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version: '24'
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Build website
        run: npm run build

      - name: Verify generated pages and resume
        shell: bash
        run: |
          for page in index about/index resume/index projects/index travel/index; do
            test -s "dist/${page}.html"
          done
          test -s dist/documents/Michael_Luong_Resume.pdf
          cmp public/documents/Michael_Luong_Resume.pdf dist/documents/Michael_Luong_Resume.pdf

      - name: Upload built website
        uses: actions/upload-artifact@v7
        with:
          name: portfolio-build
          path: dist/
          if-no-files-found: error
          retention-days: 7